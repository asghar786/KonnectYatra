name: Deploy to cPanel

# Auto-deploys to the live server on every push to main.
# You can also run it manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # --- adjust if your paths differ ---------------------------------
            APP_DIR="$HOME/konnectyatra"          # where the repo is cloned
            # -----------------------------------------------------------------

            # Resolve a PHP 8 CLI (account default is PHP 8.1 on this server)
            if command -v php >/dev/null 2>&1; then
              PHP="php"
            elif [ -x /opt/cpanel/ea-php81/root/usr/bin/php ]; then
              PHP="/opt/cpanel/ea-php81/root/usr/bin/php"
            elif [ -x /opt/cpanel/ea-php80/root/usr/bin/php ]; then
              PHP="/opt/cpanel/ea-php80/root/usr/bin/php"
            else
              echo "php CLI not found"; exit 1
            fi

            # Resolve composer
            if command -v composer >/dev/null 2>&1; then
              COMPOSER="composer"
            elif [ -f "$HOME/composer.phar" ]; then
              COMPOSER="$PHP $HOME/composer.phar"
            else
              echo "composer not found; install it or set the path"; exit 1
            fi

            cd "$APP_DIR"
            echo "==> Pulling latest code"
            git fetch --all
            git reset --hard origin/main

            echo "==> Installing PHP dependencies"
            $COMPOSER install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "==> Rebuilding Laravel caches"
            $PHP artisan optimize:clear
            $PHP artisan config:cache
            # route/view cache are best-effort (won't fail the deploy)
            $PHP artisan route:cache || true
            $PHP artisan view:cache || true

            # storage symlink (no-op if it already exists)
            $PHP artisan storage:link || true

            # NOTE: migrations are intentionally NOT run automatically.
            # This app's DB was seeded from a SQL dump and 8 legacy migrations
            # collide with `artisan migrate`. Run new migrations manually with
            # `php artisan migrate --path=...` when you add one. See DEPLOY.md.

            echo "==> Deploy complete"
