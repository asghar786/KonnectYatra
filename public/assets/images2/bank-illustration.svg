<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Bank">
  <!-- ground / steps -->
  <rect x="16" y="172" width="208" height="14" rx="3" fill="#1c2541"/>
  <rect x="30" y="158" width="180" height="14" rx="2" fill="#2a3a5c"/>
  <!-- columns -->
  <g fill="#f54e18">
    <rect x="48" y="82" width="18" height="76" rx="2"/>
    <rect x="84" y="82" width="18" height="76" rx="2"/>
    <rect x="120" y="82" width="18" height="76" rx="2"/>
    <rect x="156" y="82" width="18" height="76" rx="2"/>
  </g>
  <!-- column bases -->
  <rect x="40" y="156" width="160" height="6" rx="2" fill="#1c2541"/>
  <!-- architrave -->
  <rect x="36" y="68" width="168" height="16" rx="2" fill="#1c2541"/>
  <!-- pediment -->
  <polygon points="120,18 212,66 28,66" fill="#f54e18"/>
  <!-- dollar emblem -->
  <circle cx="120" cy="50" r="13" fill="#fff"/>
  <text x="120" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f54e18" text-anchor="middle">$</text>
</svg>
