<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 150" width="280" height="150" role="img" aria-label="Cheque">
  <!-- cheque body -->
  <rect x="6" y="10" width="268" height="130" rx="10" fill="#ffffff" stroke="#f54e18" stroke-width="3"/>
  <!-- header band -->
  <path d="M6 20 a10 10 0 0 1 10 -10 h248 a10 10 0 0 1 10 10 v14 h-268 z" fill="#f54e18"/>
  <circle cx="26" cy="22" r="8" fill="#fff"/>
  <text x="44" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">KONNECT.US, INC.</text>
  <text x="232" y="27" font-family="Arial, sans-serif" font-size="9" fill="#ffe3d6">DATE __ /__ /____</text>
  <!-- pay to line -->
  <text x="20" y="62" font-family="Arial, sans-serif" font-size="9" fill="#1c2541" font-weight="700">PAY TO THE ORDER OF</text>
  <line x1="118" y1="63" x2="198" y2="63" stroke="#c9ccd6" stroke-width="1.5"/>
  <!-- amount box -->
  <rect x="206" y="48" width="56" height="20" rx="4" fill="#fff4ef" stroke="#f54e18" stroke-width="1.5"/>
  <text x="234" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#f54e18" text-anchor="middle">$ 0.00</text>
  <!-- amount words line -->
  <line x1="20" y1="86" x2="200" y2="86" stroke="#c9ccd6" stroke-width="1.5"/>
  <text x="208" y="89" font-family="Arial, sans-serif" font-size="9" fill="#1c2541">DOLLARS</text>
  <!-- memo + signature -->
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="9" fill="#1c2541">MEMO</text>
  <line x1="52" y1="117" x2="140" y2="117" stroke="#c9ccd6" stroke-width="1.5"/>
  <line x1="176" y1="117" x2="262" y2="117" stroke="#1c2541" stroke-width="1.5"/>
  <text x="219" y="129" font-family="Arial, sans-serif" font-size="8" fill="#8a8f9c" text-anchor="middle">AUTHORIZED SIGNATURE</text>
  <!-- MICR line -->
  <text x="20" y="136" font-family="'Courier New', monospace" font-size="10" fill="#1c2541">&#9783; 021000021 &#9783;  1234567890 &#9783;</text>
</svg>
